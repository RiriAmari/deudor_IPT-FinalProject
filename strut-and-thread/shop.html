<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop All | Strut &amp; Thread</title>
  <meta name="description" content="Browse every Strut &amp; Thread piece. Filter by division, category and price.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Archivo+Black&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="shop" data-scope="all">
  <div id="site-header"></div>

  <header class="page-banner">
    <div class="page-banner__inner">
      <p class="eyebrow">The full collection</p>
      <h1>Shop All</h1>
      <p>Every piece in one place. Use the filters to narrow by division, category or price, or search for a fabric or colour.</p>
    </div>
  </header>

  <main class="wrap shop">
    <aside class="shop-filters" id="filters" aria-label="Filters"></aside>
    <section aria-label="Products">
      <div class="toolbar">
        <div style="display:flex;align-items:center;gap:.8rem;flex-wrap:wrap">
          <button class="btn btn--ghost filter-toggle" type="button" id="filterToggle" aria-expanded="false" aria-controls="filters">Filters</button>
          <p class="result-count" id="resultCount" aria-live="polite"></p>
        </div>
        <label class="sort">Sort by
          <select id="sortSelect">
            <option value="featured">Featured</option>
            <option value="newest">Newest</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="discount">Biggest discount</option>
          </select>
        </label>
      </div>
      <div class="active-note" id="activeNote" hidden></div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
